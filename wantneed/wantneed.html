<title>Want / Need</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;700&display=swap">
<style>
/* Layout: one column. Big button, add box with a Want-to-Need slider, then one stacked list: Need on top, Both, Want at the bottom.
   Colors are the Color Commentary brand: black and white, yellow (#F5C400) and red (#D9232D). Always dark, like the show art. */
:root {
  --bg: #0A0A0A; --surface: #171717; --ink: #FFFFFF; --muted: #A6A6A6; --line: #2E2E2E;
  --want: #F5C400; --need: #D9232D; --need-text: #FF4B54; --both: #EC7A12;
  --f-display: "Anton", "Arial Narrow", Impact, sans-serif;
  --f-body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.35;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 72px; }
.wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 16px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

.big { border: 0; border-radius: 14px; padding: 16px; background: var(--want); color: #0A0A0A; font-family: var(--f-display); font-size: 28px; letter-spacing: .02em; text-transform: uppercase; width: 100%; line-height: 1.1; }
.count { text-align: center; font-size: 14px; color: var(--muted); margin-top: -8px; }

/* add box */
form { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 12px; }
.addrow { display: flex; gap: 8px; }
#txt { flex: 1; min-width: 0; background: var(--bg); border: 2px solid var(--line); border-radius: 10px; padding: 12px; font-size: 18px; }
#txt:focus { border-color: var(--ink); outline: none; }
.addbtn { border: 0; border-radius: 10px; padding: 0 18px; background: var(--ink); color: var(--bg); font-weight: 700; }
.sl { display: grid; gap: 6px; }
.ends { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
.ends .w { color: var(--want); } .ends .n { color: var(--need-text); }
.ends .mid { font-family: var(--f-display); font-size: 20px; letter-spacing: .03em; font-weight: 400; }

/* the stacked bar: red fills from the left as it gets more Need, yellow is the rest */
input[type="range"].bar { -webkit-appearance: none; appearance: none; width: 100%; height: 30px; margin: 0; background: transparent; cursor: pointer; touch-action: pan-y; }
input[type="range"].bar::-webkit-slider-runnable-track { height: 14px; border-radius: 7px; background: linear-gradient(to right, var(--need) 0 var(--p), var(--want) var(--p) 100%); }
input[type="range"].bar::-moz-range-track { height: 14px; border-radius: 7px; background: linear-gradient(to right, var(--need) 0 var(--p), var(--want) var(--p) 100%); }
input[type="range"].bar::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -7px; border-radius: 50%; background: var(--ink); border: 4px solid var(--bg); box-shadow: 0 0 0 1px var(--ink); }
input[type="range"].bar::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--ink); border: 4px solid var(--bg); box-shadow: 0 0 0 1px var(--ink); }
input[type="range"].bar.small { height: 26px; }
input[type="range"].bar.small::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; }
input[type="range"].bar.small::-moz-range-track { height: 8px; border-radius: 4px; }
input[type="range"].bar.small::-webkit-slider-thumb { width: 22px; height: 22px; margin-top: -7px; border-width: 3px; }

/* the list */
.grp { display: grid; gap: 6px; }
.grp h2 { margin: 6px 0 0; font-family: var(--f-display); font-weight: 400; font-size: 24px; letter-spacing: .03em; text-transform: uppercase; line-height: 1; }
.grp.need h2 { color: var(--need-text); } .grp.both h2 { color: var(--both); } .grp.want h2 { color: var(--want); }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
li { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; display: flex; align-items: flex-start; }
li .chk { flex: none; width: 50px; min-height: 50px; border: 0; background: transparent; display: grid; place-items: center; padding: 0; color: var(--muted); }
li .chk span { width: 24px; height: 24px; border-radius: 50%; border: 2px solid currentColor; display: block; }
li .chk:hover span { background: currentColor; }
li .mid { flex: 1; min-width: 0; padding-top: 13px; display: grid; gap: 2px; }
li .t { overflow-wrap: anywhere; }
li .x { flex: none; width: 44px; height: 50px; border: 0; background: transparent; color: var(--muted); font-size: 22px; padding: 0; }
.empty { color: var(--muted); text-align: center; padding: 18px 8px; border: 1px dashed var(--line); border-radius: 12px; }

/* "just this one" screen */
#one { position: fixed; inset: 0; background: var(--bg); z-index: 20; display: grid; align-content: center; justify-items: center; gap: 20px; text-align: center;
  padding: calc(24px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); }
#oneTag { font-weight: 700; font-size: 15px; text-transform: uppercase; letter-spacing: .1em; }
#oneT { font-family: var(--f-display); font-size: 44px; line-height: 1.05; text-transform: uppercase; max-width: 16ch; overflow-wrap: anywhere; text-wrap: balance; letter-spacing: .01em; }
#one .acts { display: grid; gap: 10px; width: 100%; max-width: 340px; }
#one .acts button { border-radius: 12px; padding: 16px; font-weight: 700; font-size: 18px; }
#oneDone { border: 0; background: var(--want); color: #0A0A0A; }
#oneSkip { border: 1px solid var(--line); background: var(--surface); }
#oneBack { border: 0; background: transparent; color: var(--muted); font-weight: 500; }

#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: var(--bg);
  border-radius: 999px; padding: 12px 18px; font-size: 15px; display: flex; gap: 14px; align-items: center; max-width: calc(100% - 32px); }
#toast button { border: 0; background: transparent; color: inherit; font-weight: 700; text-decoration: underline; padding: 0; }
.note { font-size: 13px; color: var(--muted); text-align: center; }
</style>

<div class="wrap">
  <button class="big" id="go" type="button">What should I do?</button>
  <div class="count" id="count"></div>

  <form id="add" autocomplete="off">
    <div class="addrow">
      <input id="txt" type="text" placeholder="Something on your mind…" aria-label="New thing">
      <button class="addbtn" type="submit">Add</button>
    </div>
    <div class="sl">
      <div class="ends"><span class="n">Need</span><span class="mid" id="addWord">Both</span><span class="w">Want</span></div>
      <input class="bar" id="addBar" type="range" min="0" max="100" step="5" value="50" aria-label="Want or need">
    </div>
  </form>

  <div id="list"></div>
  <div class="note" id="note"></div>
</div>

<div id="one" hidden>
  <div id="oneTag"></div>
  <div id="oneT"></div>
  <div class="acts">
    <button id="oneDone" type="button">Done</button>
    <button id="oneSkip" type="button">Not this one</button>
    <button id="oneBack" type="button">Back to the list</button>
  </div>
</div>

<div id="toast" hidden></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const dayKey = ms => { const d = new Date(ms); return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate(); };
  // lean: 0 = all want, 50 = both, 100 = all need. Older items saved as need/want get 100/0.
  // On the bar, red (need) fills from the left. Slide right for more need, left for more want.
  const leanOf = t => typeof t.lean === "number" ? Math.max(0, Math.min(100, t.lean)) : t.kind === "need" ? 100 : t.kind === "want" ? 0 : 50;
  const zone = v => v > 60 ? "need" : v >= 40 ? "both" : "want";
  const word = v => v >= 85 ? "Need" : v > 60 ? "Mostly need" : v >= 40 ? "Both" : v > 15 ? "Mostly want" : "Want";
  const zoneColor = { need: "var(--need-text)", both: "var(--both)", want: "var(--want)" };
  let tasks = [], store = null, loaded = false, current = null, skipped = [], undoFn = null, toastT = null;

  // ---------- saving: your account when available, otherwise this device
  const use = n => (window.claude && typeof window.claude.use === "function") ? window.claude.use(n) : Promise.resolve(null);
  function localStore() {
    let list = []; try { list = JSON.parse(localStorage.getItem("wn.simple") || "[]"); } catch {}
    const w = () => { try { localStorage.setItem("wn.simple", JSON.stringify(list)); } catch {} };
    return { watch(cb) { cb(list.slice()); }, async save(t) { list = list.filter(x => x.id !== t.id).concat([t]); w(); }, async remove(id) { list = list.filter(x => x.id !== id); w(); } };
  }
  function dbStore(db) {
    const col = db.collection("tasks"), q = {};
    const chain = (id, fn) => (q[id] = (q[id] || Promise.resolve()).then(fn, fn));
    return {
      watch(cb, err) { col.onSnapshot(s => cb(s.docs.filter(d => d.exists).map(d => ({ ...d.data(), id: d.id }))), err); },
      save(t) { return chain(t.id, () => col.doc(t.id).set(JSON.parse(JSON.stringify(t)))); },
      remove(id) { return chain(id, () => col.doc(id).delete()); }
    };
  }
  function oops() { toast("That didn't save. Check your connection."); }
  function save(t) { tasks = tasks.filter(x => x.id !== t.id).concat([t]); render(); store && store.save(t).catch(oops); }
  function del(id) { tasks = tasks.filter(x => x.id !== id); render(); store && store.remove(id).catch(oops); }

  function toast(msg, undo) {
    clearTimeout(toastT); undoFn = undo || null;
    $("toast").innerHTML = esc(msg) + (undo ? ' <button type="button" id="undo">Undo</button>' : "");
    $("toast").hidden = false; toastT = setTimeout(() => { $("toast").hidden = true; undoFn = null; }, undo ? 6000 : 2500);
  }
  $("toast").addEventListener("click", e => { if (e.target.id === "undo" && undoFn) { const f = undoFn; undoFn = null; $("toast").hidden = true; f(); } });

  // ---------- the stacked list: Need on top, Both in the middle, Want on the bottom
  const openTasks = () => tasks.filter(t => !t.done).sort((a, b) => leanOf(b) - leanOf(a) || (a.created || 0) - (b.created || 0));
  function render() {
    const items = openTasks();
    if (!items.length) $("list").innerHTML = `<div class="empty">${loaded ? "Nothing on the list. Add something up top." : "Loading…"}</div>`;
    else {
      const groups = { need: [], both: [], want: [] };
      items.forEach(t => groups[zone(leanOf(t))].push(t));
      $("list").innerHTML = [["need", "Need"], ["both", "Both"], ["want", "Want"]].filter(([k]) => groups[k].length).map(([k, label]) =>
        `<section class="grp ${k}"><h2>${label}</h2><ul>${groups[k].map(t => { const v = leanOf(t); return `<li data-id="${esc(t.id)}">
          <button class="chk" type="button" data-a="done" aria-label="Done: ${esc(t.title)}"><span></span></button>
          <div class="mid"><span class="t">${esc(t.title)}</span>
            <input class="bar small" type="range" min="0" max="100" step="5" value="${v}" style="--p:${v}%" aria-label="Want or need: ${esc(t.title)}" id="b_${esc(t.id)}"></div>
          <button class="x" type="button" data-a="del" aria-label="Delete ${esc(t.title)}">×</button></li>`; }).join("")}</ul></section>`).join("");
    }
    const today = dayKey(Date.now()), n = tasks.filter(t => t.done && t.doneAt && dayKey(t.doneAt) === today).length;
    $("count").textContent = n ? n + " done today" : "";
  }
  function finish(t) { const was = { ...t }; save({ ...t, done: true, doneAt: Date.now() }); toast("Done: " + t.title, () => save(was)); }
  $("list").addEventListener("click", e => {
    const b = e.target.closest("[data-a]"), li = e.target.closest("li[data-id]"); if (!b || !li) return;
    const t = tasks.find(x => x.id === li.dataset.id); if (!t) return;
    if (b.dataset.a === "done") finish(t);
    else { const was = { ...t }; del(t.id); toast("Deleted", () => save(was)); }
  });
  // sliding: the bar repaints while you drag, the list re-sorts when you let go
  $("list").addEventListener("input", e => { if (e.target.classList.contains("bar")) e.target.style.setProperty("--p", e.target.value + "%"); });
  $("list").addEventListener("change", e => {
    if (!e.target.classList.contains("bar")) return;
    const li = e.target.closest("li[data-id]"), t = li && tasks.find(x => x.id === li.dataset.id); if (!t) return;
    const v = Number(e.target.value); if (v !== leanOf(t)) save({ ...t, lean: v });
  });

  // ---------- adding
  function paintAdd() { const v = Number($("addBar").value); $("addBar").style.setProperty("--p", v + "%"); $("addWord").textContent = word(v); $("addWord").style.color = zoneColor[zone(v)]; }
  $("addBar").addEventListener("input", paintAdd); paintAdd();
  $("add").addEventListener("submit", e => {
    e.preventDefault();
    const v = $("txt").value.trim(); if (!v) { $("txt").focus(); return; }
    save({ id: "t_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title: v, lean: Number($("addBar").value), done: false, doneAt: null, created: Date.now() });
    $("txt").value = ""; $("txt").focus();
  });

  // ---------- "What should I do?"
  // The most need first. Right after you finish something that leaned need, it hands you the most want as a reward.
  function choose() {
    const pool = openTasks().filter(t => !skipped.includes(t.id)); if (!pool.length) return null;
    const last = tasks.filter(t => t.done && t.doneAt).sort((a, b) => b.doneAt - a.doneAt)[0];
    const earned = last && leanOf(last) > 60 && Date.now() - last.doneAt < 6 * 36e5;
    const treat = pool[pool.length - 1];
    if (earned && leanOf(treat) < 40) return { t: treat, why: "You did a need. Have a want." };
    return { t: pool[0], why: word(leanOf(pool[0])) };
  }
  function show() {
    const c = choose(); current = c && c.t;
    if (!c) {
      $("oneTag").textContent = ""; $("oneT").textContent = openTasks().length ? "That's everything. Pick any, or take a break." : "Nothing on the list. You're free.";
      $("oneDone").hidden = true; $("oneSkip").hidden = !skipped.length; $("oneSkip").textContent = "Start over";
    } else {
      $("oneTag").textContent = c.why; $("oneTag").style.color = zoneColor[zone(leanOf(c.t))];
      $("oneT").textContent = c.t.title; $("oneDone").hidden = false; $("oneSkip").hidden = false; $("oneSkip").textContent = "Not this one";
    }
    $("one").hidden = false;
  }
  $("go").addEventListener("click", () => { skipped = []; show(); });
  $("oneDone").addEventListener("click", () => { if (current) finish(current); skipped = []; show(); });
  $("oneSkip").addEventListener("click", () => { if (current) skipped.push(current.id); else skipped = []; show(); });
  $("oneBack").addEventListener("click", () => { $("one").hidden = true; });
  document.addEventListener("keydown", e => { if (e.key === "Escape") $("one").hidden = true; });

  // ---------- start
  render();
  (async () => {
    const db = await use("db");
    store = db ? dbStore(db) : localStore();
    if (!db) $("note").textContent = "Saved on this device only.";
    store.watch(list => { tasks = list; loaded = true; render(); }, () => { $("note").textContent = "Lost the connection. Reload the page."; });
  })();
})();
</script>
