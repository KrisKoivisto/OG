<title>Want / Need</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column. Big button, add box, then one list grouped Urgent, Both, Need, Want. Every task has two up-and-down faders: red Need, acid Want.
   Colors and type are kriskoivisto.com: near-black zinc, acid green (#CCFF00), red (#E03A3E), cement; Anton, Manrope, JetBrains Mono.
   Square corners and spaced-out mono labels, like the site. Always dark, like the site. */
:root {
  --bg: #09090B; --surface: #18181B; --border: #27272A; --ink: #F4F4F5; --muted: #A1A1AA; --dim: #71717A;
  --want: #CCFF00; --need: #E03A3E; --need-text: #F0575B; --both: #B9B9BD;
  --f-display: Anton, Impact, "Arial Narrow", sans-serif;
  --f-body: Manrope, -apple-system, BlinkMacSystemFont, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
::selection { background: var(--want); color: var(--bg); }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.35;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 56px; }
.wrap { max-width: 520px; margin: 0 auto; display: grid; gap: 10px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--want); outline-offset: 2px; }

.big { border: 2px solid var(--want); border-radius: 0; padding: 9px; background: transparent; color: var(--want); font-family: var(--f-display); font-size: 21px; letter-spacing: .03em; text-transform: uppercase; width: 100%; line-height: 1.1;
  box-shadow: 0 0 18px rgba(204,255,0,.18); transition: background .15s, color .15s, box-shadow .15s; }
.big:hover, .big:active { background: var(--want); color: var(--bg); box-shadow: 0 0 28px rgba(204,255,0,.35); }
.count { text-align: center; font: 400 11px var(--f-mono); letter-spacing: .3em; text-transform: uppercase; color: var(--muted); margin-top: -4px; font-size: 10px; }
.count:not(:empty)::before { content: "/// "; color: var(--want); }

/* add box */
form { background: var(--surface); border: 1px solid var(--border); padding: 8px; display: grid; gap: 8px; }
.addrow { display: flex; gap: 6px; }
#txt { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--border); border-radius: 0; padding: 8px 10px; font-size: 16px; }
#txt:focus { border-color: var(--ink); outline: none; }
#txt::placeholder { color: var(--dim); }
.addbtn { border: 0; border-radius: 0; padding: 0 14px; background: var(--ink); color: var(--bg); font: 500 12px var(--f-mono); letter-spacing: .2em; text-transform: uppercase; }
.sl { display: grid; gap: 6px; }
.ends { display: flex; justify-content: space-between; align-items: baseline; font: 500 11px var(--f-mono); text-transform: uppercase; letter-spacing: .3em; }
.ends .w { color: var(--want); } .ends .n { color: var(--need-text); }
.ends .mid { font-family: var(--f-display); font-size: 22px; letter-spacing: .03em; font-weight: 400; }

/* faders: fill from the bottom, drag or tap anywhere on them */
.faders { display: flex; gap: 4px; align-items: flex-end; flex: none; }
.fd { display: grid; justify-items: center; gap: 2px; }
.fader { position: relative; width: 18px; height: 40px; background: var(--bg); box-shadow: inset 0 0 0 1px var(--border); cursor: ns-resize; touch-action: none; -webkit-user-select: none; user-select: none; }
.fader i { position: absolute; left: 0; right: 0; bottom: 0; height: var(--v); }
.fader i::before { content: ""; position: absolute; left: -3px; right: -3px; top: -2px; height: 4px; background: var(--ink); }
.fader.need i { background: var(--need); } .fader.want i { background: var(--want); }
.fader:focus { outline: none; }
.fader:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.fd small { font: 500 8px var(--f-mono); letter-spacing: .15em; text-transform: uppercase; }
.fd small.n { color: var(--need-text); } .fd small.w { color: var(--want); }
.fader.lg { width: 30px; height: 56px; }
li .fader { height: 32px; }
li .fd small { display: none; }
.addopts { display: flex; gap: 10px; align-items: flex-end; }
.addopts .faders { gap: 8px; }
.addopts .side { flex: 1; min-width: 0; display: grid; gap: 6px; align-content: end; }
.toggle { border: 1px solid var(--border); background: var(--bg); color: var(--muted); padding: 7px 10px; font: 500 10px var(--f-mono); letter-spacing: .25em; text-transform: uppercase; text-align: left; }
.toggle[aria-pressed="true"] { background: var(--need); border-color: var(--need); color: #fff; }
.hintline { font-size: 12px; color: var(--muted); line-height: 1.35; }

/* the list */
.grp { display: grid; gap: 4px; }
.grp h2 { margin: 4px 0 0; font-family: var(--f-display); font-weight: 400; font-size: 16px; letter-spacing: .03em; text-transform: uppercase; line-height: 1; }
.grp.need h2 { color: var(--need-text); } .grp.both h2 { color: var(--both); } .grp.want h2 { color: var(--want); }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
li { background: var(--surface); border: 1px solid var(--border); display: flex; align-items: flex-start; }
li .chk { flex: none; width: 38px; min-height: 40px; border: 0; background: transparent; display: grid; place-items: center; padding: 0; color: var(--dim); }
li .chk span { width: 17px; height: 17px; border: 2px solid currentColor; display: block; }
li .chk:hover { color: var(--want); } li .chk:hover span { background: currentColor; }
li .mid { flex: 1; min-width: 0; padding-top: 13px; display: grid; gap: 2px; }
li .t { overflow-wrap: anywhere; font-weight: 500; font-size: 15px; line-height: 1.25; }
li .x { flex: none; align-self: center !important; width: 32px; height: 40px; border: 0; background: transparent; color: var(--dim); font-size: 18px; padding: 0; }
li .x:hover { color: var(--ink); }
.empty { color: var(--muted); text-align: center; padding: 12px 8px; font-size: 14px; border: 1px dashed var(--border); }

li { align-items: stretch; }
li .mid { padding: 10px 0; cursor: pointer; align-content: center; gap: 4px; }
li .faders { padding: 5px 2px 5px 6px; align-items: center; }
li .x { align-self: flex-start; }
li.urgent { border-color: var(--need); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: 500 8.5px var(--f-mono); letter-spacing: .15em; text-transform: uppercase; padding: 2px 5px; border: 1px solid var(--border); color: var(--muted); }
.chip.u { background: var(--need); border-color: var(--need); color: #fff; }
.chip.r { color: var(--want); border-color: rgba(204,255,0,.4); }
.chip.now { background: var(--want); border-color: var(--want); color: var(--bg); }
.more { font: 500 10px var(--f-mono); letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }
.panel { background: var(--surface); border: 1px solid var(--border); border-top: 0; margin-top: -4px; padding: 8px 10px 10px; display: grid; gap: 6px; }
.panel label { font: 500 9px var(--f-mono); letter-spacing: .25em; text-transform: uppercase; color: var(--muted); }
.panel input[type="datetime-local"] { flex: 1; width: auto; min-width: 0; background: var(--bg); border: 1px solid var(--border); border-radius: 0; padding: 6px 8px; font-size: 16px; }
.prow { display: flex; gap: 6px; flex-wrap: wrap; }
.pbtn { border: 1px solid var(--border); background: var(--bg); color: var(--ink); padding: 7px 9px; font: 500 9.5px var(--f-mono); letter-spacing: .15em; text-transform: uppercase; text-decoration: none; display: inline-block; }
.pbtn.cal { border-color: var(--want); color: var(--want); }
.pbtn.ghost { border-color: transparent; color: var(--muted); }

/* "just this one" screen */
#one { position: fixed; inset: 0; background: var(--bg); z-index: 20; display: grid; align-content: center; justify-items: center; gap: 14px; text-align: center;
  padding: calc(24px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); }
#oneTag { font: 500 11px var(--f-mono); text-transform: uppercase; letter-spacing: .3em; }
#oneTag:not(:empty)::before { content: "/// "; }
#oneT { font-family: var(--f-display); font-size: 34px; line-height: 1.02; text-transform: uppercase; max-width: 16ch; overflow-wrap: anywhere; text-wrap: balance; letter-spacing: .01em; }
#one .acts { display: grid; gap: 8px; width: 100%; max-width: 300px; }
#one .acts button { border-radius: 0; padding: 12px; font: 500 11px var(--f-mono); letter-spacing: .25em; text-transform: uppercase; }
#oneDone { border: 0; background: var(--want); color: var(--bg); box-shadow: 0 0 28px rgba(204,255,0,.3); }
#oneSkip { border: 1px solid var(--border); background: var(--surface); }
#oneBack { border: 0; background: transparent; color: var(--muted); }

#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: var(--bg);
  padding: 9px 14px; font-size: 13px; font-weight: 500; display: flex; gap: 14px; align-items: center; max-width: calc(100% - 32px); }
#toast button { border: 0; background: transparent; color: inherit; font-weight: 700; text-decoration: underline; padding: 0; }
.note { font: 400 9px var(--f-mono); letter-spacing: .2em; text-transform: uppercase; color: var(--dim); text-align: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <button class="big" id="go" type="button">What should I do?</button>
  <div class="count" id="count"></div>

  <form id="add" autocomplete="off">
    <div class="addrow">
      <input id="txt" type="text" placeholder="Something on your mind…" aria-label="New thing">
      <button class="addbtn" type="submit">Add</button>
    </div>
    <div class="addopts">
      <div class="faders">
        <div class="fd"><div class="fader need lg" id="addNeed" role="slider" tabindex="0" aria-label="How much I need to" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" style="--v:50%"><i></i></div><small class="n">Need</small></div>
        <div class="fd"><div class="fader want lg" id="addWant" role="slider" tabindex="0" aria-label="How much I want to" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" style="--v:50%"><i></i></div><small class="w">Want</small></div>
      </div>
      <div class="side">
        <div class="hintline">Slide up or down. Tap a task for urgent or a reminder.</div>
        <button class="toggle" type="button" id="addUrgent" aria-pressed="false">Urgent</button>
      </div>
    </div>
  </form>

  <div id="list"></div>
  <div class="note" id="note"></div>
</div>

<div id="one" hidden>
  <div id="oneTag"></div>
  <div id="oneT"></div>
  <div class="acts">
    <button id="oneDone" type="button">Done</button>
    <button id="oneSkip" type="button">Not this one</button>
    <button id="oneBack" type="button">Back to the list</button>
  </div>
</div>

<div id="toast" hidden></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pad = n => String(n).padStart(2, "0");
  const dayKey = ms => { const d = new Date(ms); return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate(); };
  const clamp = v => Math.max(0, Math.min(100, Math.round((Number(v) || 0) / 5) * 5));
  // need and want are 0-100 each. Older saved items (one slider, or need/want lists) are converted on read.
  const both = t => typeof t.need === "number" && typeof t.want === "number";
  const needOf = t => both(t) ? clamp(t.need) : typeof t.lean === "number" ? clamp(t.lean) : t.kind === "need" ? 100 : t.kind === "want" ? 0 : 50;
  const wantOf = t => both(t) ? clamp(t.want) : typeof t.lean === "number" ? clamp(100 - t.lean) : t.kind === "want" ? 100 : t.kind === "need" ? 0 : 50;
  const ringing = t => !t.done && t.remindAt && t.remindAt <= Date.now();
  const groupOf = t => t.urgent || ringing(t) ? "urgent" : needOf(t) >= 50 && wantOf(t) >= 50 ? "both" : needOf(t) >= wantOf(t) ? "need" : "want";
  const GROUPS = [["urgent", "Urgent"], ["both", "Both"], ["need", "Need"], ["want", "Want"]];
  const groupColor = { urgent: "var(--need-text)", both: "var(--both)", need: "var(--need-text)", want: "var(--want)" };
  let tasks = [], store = null, loaded = false, current = null, skipped = [], undoFn = null, toastT = null, openId = null;
  let draft = { need: 50, want: 50, urgent: false };

  // ---------- saving: your account when available, otherwise this device
  const use = n => (window.claude && typeof window.claude.use === "function") ? window.claude.use(n) : Promise.resolve(null);
  function localStore() {
    let list = []; try { list = JSON.parse(localStorage.getItem("wn.simple") || "[]"); } catch {}
    const w = () => { try { localStorage.setItem("wn.simple", JSON.stringify(list)); } catch {} };
    return { watch(cb) { cb(list.slice()); }, async save(t) { list = list.filter(x => x.id !== t.id).concat([t]); w(); }, async remove(id) { list = list.filter(x => x.id !== id); w(); } };
  }
  function dbStore(db) {
    const col = db.collection("tasks"), q = {};
    const chain = (id, fn) => (q[id] = (q[id] || Promise.resolve()).then(fn, fn));
    return {
      watch(cb, err) { col.onSnapshot(s => cb(s.docs.filter(d => d.exists).map(d => ({ ...d.data(), id: d.id }))), err); },
      save(t) { return chain(t.id, () => col.doc(t.id).set(JSON.parse(JSON.stringify(t)))); },
      remove(id) { return chain(id, () => col.doc(id).delete()); }
    };
  }
  function oops() { toast("That didn't save. Check your connection."); }
  // every save writes the item in the current shape (need, want, urgent, remindAt)
  function norm(t) { const { lean, kind, ...r } = t; return { ...r, need: needOf(t), want: wantOf(t), urgent: !!t.urgent, remindAt: t.remindAt || null }; }
  function save(t) { t = norm(t); tasks = tasks.filter(x => x.id !== t.id).concat([t]); render(); store && store.save(t).catch(oops); }
  function del(id) { tasks = tasks.filter(x => x.id !== id); render(); store && store.remove(id).catch(oops); }

  function toast(msg, undo) {
    clearTimeout(toastT); undoFn = undo || null;
    $("toast").innerHTML = esc(msg) + (undo ? ' <button type="button" id="undo">Undo</button>' : "");
    $("toast").hidden = false; toastT = setTimeout(() => { $("toast").hidden = true; undoFn = null; }, undo ? 6000 : 3500);
  }
  $("toast").addEventListener("click", e => { if (e.target.id === "undo" && undoFn) { const f = undoFn; undoFn = null; $("toast").hidden = true; f(); } });

  // ---------- reminders
  const fmtWhen = ms => { const d = new Date(ms), today = dayKey(Date.now()) === dayKey(ms), tm = new Date(Date.now() + 864e5);
    const day = today ? "Today" : dayKey(tm.getTime()) === dayKey(ms) ? "Tomorrow" : d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
    return day + " " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }); };
  const toLocalInput = ms => { const d = new Date(ms); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes()); };
  // iPhone Calendar takes events as a calendar file. This free link service turns the details into one, with an alert at the start time.
  function calLink(t) {
    const a = new Date(t.remindAt), b = new Date(t.remindAt + 30 * 6e4);
    const q = new URLSearchParams({ subject: t.title, description: "From Want / Need", dtstart: a.toISOString().replace(/\.\d+Z$/, "Z"), dtend: b.toISOString().replace(/\.\d+Z$/, "Z"), reminder: "0" });
    return "https://ics.agical.io/?" + q.toString();
  }
  function siriText(t) {
    const d = new Date(t.remindAt);
    return "Remind me to " + t.title + " on " + d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" }) + " at " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  }

  // ---------- the list
  const score = t => (t.urgent ? 1000 : 0) + (ringing(t) ? 500 : 0) + needOf(t) + wantOf(t) * 0.6;
  const openTasks = () => tasks.filter(t => !t.done).sort((a, b) => score(b) - score(a) || (a.created || 0) - (b.created || 0));
  const fader = (kind, v, label, id) => `<div class="fd"><div class="fader ${kind}" role="slider" tabindex="0" data-f="${kind}" aria-label="${kind === "need" ? "Need" : "Want"}: ${esc(label)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${v}" style="--v:${v}%"${id ? ` id="${id}"` : ""}><i></i></div><small class="${kind[0]}">${kind === "need" ? "N" : "W"}</small></div>`;
  function panel(t) {
    return `<li class="panel" data-id="${esc(t.id)}">
      <div class="prow">
        <button class="toggle" type="button" data-a="urgent" aria-pressed="${!!t.urgent}">Urgent</button>
        <input type="datetime-local" id="re_${esc(t.id)}" data-a="when" aria-label="Remind me" value="${t.remindAt ? toLocalInput(t.remindAt) : ""}">
      </div>
      <div class="prow">
        ${t.remindAt ? `<a class="pbtn cal" href="${esc(calLink(t))}" target="_blank" rel="noopener">iPhone Calendar</a>
        <button class="pbtn" type="button" data-a="siri">Copy for Siri</button>
        <button class="pbtn ghost" type="button" data-a="clearwhen">Clear time</button>` : ""}
        <button class="pbtn ghost" type="button" data-a="close">Close</button>
      </div>
      <div class="hintline">${t.remindAt ? "Siri makes it a real Reminder: hold the side button and paste." : "Pick a time to send it to your calendar or Siri."}</div>
    </li>`;
  }
  function row(t) {
    const chips = [];
    if (t.urgent) chips.push(`<span class="chip u">Urgent</span>`);
    if (t.remindAt) chips.push(`<span class="chip ${ringing(t) ? "now" : "r"}">${ringing(t) ? "Now" : esc(fmtWhen(t.remindAt))}</span>`);
    return `<li data-id="${esc(t.id)}" class="${t.urgent ? "urgent" : ""}">
      <button class="chk" type="button" data-a="done" aria-label="Done: ${esc(t.title)}"><span></span></button>
      <div class="mid" data-a="open"><span class="t">${esc(t.title)}</span>${chips.length ? `<div class="chips">${chips.join("")}</div>` : ""}</div>
      <div class="faders">${fader("need", needOf(t), t.title)}${fader("want", wantOf(t), t.title)}</div>
      <button class="x" type="button" data-a="del" aria-label="Delete ${esc(t.title)}">×</button></li>${openId === t.id ? panel(t) : ""}`;
  }
  function render() {
    const items = openTasks();
    if (!items.length) $("list").innerHTML = `<div class="empty">${loaded ? "Nothing on the list. Add something up top." : "Loading…"}</div>`;
    else {
      const g = { urgent: [], both: [], need: [], want: [] };
      items.forEach(t => g[groupOf(t)].push(t));
      $("list").innerHTML = GROUPS.filter(([k]) => g[k].length).map(([k, label]) => `<section class="grp ${k}"><h2 style="color:${groupColor[k]}">${label}</h2><ul>${g[k].map(row).join("")}</ul></section>`).join("");
    }
    const today = dayKey(Date.now()), n = tasks.filter(t => t.done && t.doneAt && dayKey(t.doneAt) === today).length;
    $("count").textContent = n ? n + " done today" : "";
    const ring = tasks.filter(ringing).length; document.title = ring ? "(" + ring + ") Want / Need" : "Want / Need";
  }
  function finish(t) { const was = { ...t }; if (openId === t.id) openId = null; save({ ...t, done: true, doneAt: Date.now() }); toast("Done: " + t.title, () => save(was)); }

  $("list").addEventListener("click", async e => {
    const b = e.target.closest("[data-a]"); if (!b || b.classList.contains("fader")) return;
    const host = e.target.closest("[data-id]"); const t = host && tasks.find(x => x.id === host.dataset.id); if (!t) return;
    switch (b.dataset.a) {
      case "done": finish(t); break;
      case "del": { const was = { ...t }; if (openId === t.id) openId = null; del(t.id); toast("Deleted", () => save(was)); break; }
      case "open": openId = openId === t.id ? null : t.id; render(); break;
      case "close": openId = null; render(); break;
      case "urgent": save({ ...t, urgent: !t.urgent }); break;
      case "clearwhen": save({ ...t, remindAt: null }); break;
      case "siri": {
        const txt = siriText(t);
        try { await navigator.clipboard.writeText(txt); toast("Copied. Now hold the side button and paste it to Siri."); }
        catch { toast(txt); }
        break;
      }
    }
  });
  $("list").addEventListener("change", e => {
    if (e.target.dataset.a !== "when") return;
    const host = e.target.closest("[data-id]"); const t = host && tasks.find(x => x.id === host.dataset.id); if (!t) return;
    const v = e.target.value ? new Date(e.target.value).getTime() : null;
    if (v !== t.remindAt) save({ ...t, remindAt: v });
  });

  // ---------- faders: drag or tap. The fill follows your finger; it saves when you let go.
  let drag = null;
  const valAt = (el, y) => { const r = el.getBoundingClientRect(); return clamp((r.bottom - y) / r.height * 100); };
  const paint = (el, v) => { el.style.setProperty("--v", v + "%"); el.setAttribute("aria-valuenow", v); };
  function commit(el, v) {
    if (el.id === "addNeed") { draft.need = v; return; }
    if (el.id === "addWant") { draft.want = v; return; }
    const li = el.closest("li[data-id]"); const t = li && tasks.find(x => x.id === li.dataset.id); if (!t) return;
    const f = el.dataset.f; if ((f === "need" ? needOf(t) : wantOf(t)) !== v) save({ ...t, [f]: v });
  }
  document.addEventListener("pointerdown", e => {
    const el = e.target.closest(".fader"); if (!el) return;
    e.preventDefault(); drag = { el, v: valAt(el, e.clientY) }; paint(el, drag.v);
    try { el.setPointerCapture(e.pointerId); } catch {}
  });
  document.addEventListener("pointermove", e => { if (!drag) return; drag.v = valAt(drag.el, e.clientY); paint(drag.el, drag.v); });
  const end = () => { if (!drag) return; const d = drag; drag = null; commit(d.el, d.v); };
  document.addEventListener("pointerup", end); document.addEventListener("pointercancel", end);
  document.addEventListener("keydown", e => {
    const el = e.target.closest && e.target.closest(".fader"); if (!el) return;
    const step = { ArrowUp: 10, ArrowRight: 10, ArrowDown: -10, ArrowLeft: -10 }[e.key]; if (!step) return;
    e.preventDefault(); const v = clamp(Number(el.getAttribute("aria-valuenow")) + step); paint(el, v); commit(el, v);
  });

  // ---------- adding
  $("addUrgent").addEventListener("click", () => { draft.urgent = !draft.urgent; $("addUrgent").setAttribute("aria-pressed", String(draft.urgent)); });
  $("add").addEventListener("submit", e => {
    e.preventDefault();
    const v = $("txt").value.trim(); if (!v) { $("txt").focus(); return; }
    save({ id: "t_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title: v, need: draft.need, want: draft.want, urgent: draft.urgent, remindAt: null, done: false, doneAt: null, created: Date.now() });
    $("txt").value = ""; $("txt").focus();
    draft.urgent = false; $("addUrgent").setAttribute("aria-pressed", "false");
  });

  // ---------- "What should I do?"
  // Urgent and reminders that are due come first, then the most need. Right after you finish a need, it hands you a want.
  function choose() {
    const pool = openTasks().filter(t => !skipped.includes(t.id)); if (!pool.length) return null;
    const top = pool[0];
    if (top.urgent || ringing(top)) return { t: top, why: top.urgent ? "Urgent" : "Reminder" };
    const last = tasks.filter(t => t.done && t.doneAt).sort((a, b) => b.doneAt - a.doneAt)[0];
    const earned = last && needOf(last) > wantOf(last) && Date.now() - last.doneAt < 6 * 36e5;
    const treats = pool.filter(t => groupOf(t) === "want").sort((a, b) => wantOf(b) - wantOf(a));
    if (earned && treats.length) return { t: treats[0], why: "You did a need. Have a want." };
    const g = groupOf(top); return { t: top, why: g === "both" ? "Need it and want it" : g === "need" ? "Need" : "Want" };
  }
  function show() {
    const c = choose(); current = c && c.t;
    if (!c) {
      $("oneTag").textContent = ""; $("oneT").textContent = openTasks().length ? "That's everything. Pick any, or take a break." : "Nothing on the list. You're free.";
      $("oneDone").hidden = true; $("oneSkip").hidden = !skipped.length; $("oneSkip").textContent = "Start over";
    } else {
      $("oneTag").textContent = c.why; $("oneTag").style.color = c.why === "You did a need. Have a want." ? "var(--want)" : groupColor[groupOf(c.t)];
      $("oneT").textContent = c.t.title; $("oneDone").hidden = false; $("oneSkip").hidden = false; $("oneSkip").textContent = "Not this one";
    }
    $("one").hidden = false;
  }
  $("go").addEventListener("click", () => { skipped = []; show(); });
  $("oneDone").addEventListener("click", () => { if (current) finish(current); skipped = []; show(); });
  $("oneSkip").addEventListener("click", () => { if (current) skipped.push(current.id); else skipped = []; show(); });
  $("oneBack").addEventListener("click", () => { $("one").hidden = true; });
  document.addEventListener("keydown", e => { if (e.key === "Escape") { if (!$("one").hidden) $("one").hidden = true; else if (openId) { openId = null; render(); } } });

  // re-check reminders every 30 seconds while the page is open
  let sig = "";
  setInterval(() => { if (drag) return; const s = tasks.filter(ringing).map(t => t.id).join(",") + dayKey(Date.now()); if (s !== sig) { sig = s; render(); } }, 30000);

  // ---------- start
  render();
  (async () => {
    const db = await use("db");
    store = db ? dbStore(db) : localStore();
    if (!db) $("note").textContent = "Saved on this device only.";
    store.watch(list => { tasks = list; loaded = true; if (!drag) render(); }, () => { $("note").textContent = "Lost the connection. Reload the page."; });
  })();
})();
</script>
