[project]
name = "ccpod"
version = "0.1.0"
description = "Color Commentary post-production: Shorts, captions, and show notes from a Riverside recording."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.75",
  "pydantic>=2.6",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
ccpod = "ccpod.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ccpod"]
