<title>Want / Need</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: one column. Big "what do I do" button, one input with two buttons, then the Need list and the Want list. */
:root {
  --bg: #F1F4F3; --surface: #FFFFFF; --ink: #17201F; --muted: #5F6E6B; --line: #D3DCD9;
  --need: #D9472B; --want: #168A7D; --on: #FFFFFF;
  --f-display: "Bricolage Grotesque", "Arial Narrow", sans-serif;
  --f-body: "Rubik", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0F1514; --surface: #182120; --ink: #ECF1EF; --muted: #98A9A4; --line: #2B3836; --need: #F0694C; --want: #2BB3A2; --on: #0F1514; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0F1514; --surface: #182120; --ink: #ECF1EF; --muted: #98A9A4; --line: #2B3836; --need: #F0694C; --want: #2BB3A2; --on: #0F1514; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.35;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 64px; }
.wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 16px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

.big { border: 0; border-radius: 16px; padding: 18px; background: var(--ink); color: var(--bg); font-family: var(--f-display); font-weight: 800; font-size: 24px; width: 100%; }
.count { text-align: center; font-size: 14px; color: var(--muted); margin-top: -8px; }

form { display: grid; gap: 8px; }
#txt { width: 100%; min-width: 0; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 14px; font-size: 18px; }
#txt:focus { border-color: var(--ink); outline: none; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.two button { border: 0; border-radius: 12px; padding: 13px; font-weight: 700; font-size: 17px; color: var(--on); }
.n { background: var(--need); } .w { background: var(--want); }

h2 { margin: 0 0 8px; font-family: var(--f-display); font-weight: 800; font-size: 22px; }
h2.need { color: var(--need); } h2.want { color: var(--want); }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
li { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; display: flex; align-items: center; gap: 4px; min-height: 52px; }
li .chk { flex: none; width: 52px; height: 52px; border: 0; background: transparent; display: grid; place-items: center; padding: 0; }
li .chk span { width: 24px; height: 24px; border-radius: 50%; border: 2px solid currentColor; display: block; }
li.need .chk { color: var(--need); } li.want .chk { color: var(--want); }
li .t { flex: 1; min-width: 0; overflow-wrap: anywhere; padding-block: 12px; }
li .x { flex: none; width: 44px; height: 52px; border: 0; background: transparent; color: var(--muted); font-size: 22px; padding: 0; }
.empty { color: var(--muted); font-size: 15px; padding: 4px 2px; }

/* the "just this one" screen */
#one { position: fixed; inset: 0; background: var(--bg); z-index: 20; display: grid; align-content: center; justify-items: center; gap: 20px; text-align: center;
  padding: calc(24px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); }
#one .tag { font-weight: 700; font-size: 15px; text-transform: uppercase; letter-spacing: .08em; }
#one .tag.need { color: var(--need); } #one .tag.want { color: var(--want); }
#oneT { font-family: var(--f-display); font-weight: 800; font-size: 38px; line-height: 1.1; max-width: 18ch; overflow-wrap: anywhere; text-wrap: balance; }
#one .acts { display: grid; gap: 10px; width: 100%; max-width: 340px; }
#one .acts button { border-radius: 14px; padding: 16px; font-weight: 700; font-size: 18px; }
#oneDone { border: 0; background: var(--ink); color: var(--bg); }
#oneSkip, #oneBack { border: 1px solid var(--line); background: var(--surface); }
#oneBack { border: 0; background: transparent; color: var(--muted); font-weight: 500; }

#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: var(--bg);
  border-radius: 999px; padding: 12px 18px; font-size: 15px; display: flex; gap: 14px; align-items: center; max-width: calc(100% - 32px); }
#toast button { border: 0; background: transparent; color: inherit; font-weight: 700; text-decoration: underline; padding: 0; }
.note { font-size: 13px; color: var(--muted); text-align: center; }
</style>

<div class="wrap">
  <button class="big" id="go" type="button">What should I do?</button>
  <div class="count" id="count"></div>

  <form id="add" autocomplete="off">
    <input id="txt" type="text" placeholder="Something on your mind…" aria-label="New thing">
    <div class="two"><button class="n" type="submit" data-k="need">I need to</button><button class="w" type="submit" data-k="want">I want to</button></div>
  </form>

  <section><h2 class="need">Need</h2><ul id="needL"></ul></section>
  <section><h2 class="want">Want</h2><ul id="wantL"></ul></section>
  <div class="note" id="note"></div>
</div>

<div id="one" hidden>
  <div class="tag" id="oneTag"></div>
  <div id="oneT"></div>
  <div class="acts">
    <button id="oneDone" type="button">Done</button>
    <button id="oneSkip" type="button">Not this one</button>
    <button id="oneBack" type="button">Back to the list</button>
  </div>
</div>

<div id="toast" hidden></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const dayKey = ms => { const d = new Date(ms); return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate(); };
  // older saved items had number scores; turn them into need or want
  const kindOf = t => t.kind === "need" || t.kind === "want" ? t.kind : ((Number(t.need) || 0) >= (Number(t.want) || 0) ? "need" : "want");
  let tasks = [], store = null, loaded = false, current = null, skipped = [], undoFn = null, toastT = null;

  // ---------- saving: your account when available, otherwise this device
  const use = n => (window.claude && typeof window.claude.use === "function") ? window.claude.use(n) : Promise.resolve(null);
  function localStore() {
    let list = []; try { list = JSON.parse(localStorage.getItem("wn.simple") || "[]"); } catch {}
    const w = () => { try { localStorage.setItem("wn.simple", JSON.stringify(list)); } catch {} };
    return { watch(cb) { cb(list.slice()); }, async save(t) { list = list.filter(x => x.id !== t.id).concat([t]); w(); }, async remove(id) { list = list.filter(x => x.id !== id); w(); } };
  }
  function dbStore(db) {
    const col = db.collection("tasks"), q = {};
    const chain = (id, fn) => (q[id] = (q[id] || Promise.resolve()).then(fn, fn));
    return {
      watch(cb, err) { col.onSnapshot(s => cb(s.docs.filter(d => d.exists).map(d => ({ ...d.data(), id: d.id }))), err); },
      save(t) { return chain(t.id, () => col.doc(t.id).set(JSON.parse(JSON.stringify(t)))); },
      remove(id) { return chain(id, () => col.doc(id).delete()); }
    };
  }
  function oops() { toast("That didn't save. Check your connection."); }
  function save(t) { tasks = tasks.filter(x => x.id !== t.id).concat([t]); render(); store && store.save(t).catch(oops); }
  function del(id) { tasks = tasks.filter(x => x.id !== id); render(); store && store.remove(id).catch(oops); }

  function toast(msg, undo) {
    clearTimeout(toastT); undoFn = undo || null;
    $("toast").innerHTML = esc(msg) + (undo ? ' <button type="button" id="undo">Undo</button>' : "");
    $("toast").hidden = false; toastT = setTimeout(() => { $("toast").hidden = true; undoFn = null; }, undo ? 6000 : 2500);
  }
  $("toast").addEventListener("click", e => { if (e.target.id === "undo" && undoFn) { const f = undoFn; undoFn = null; $("toast").hidden = true; f(); } });

  // ---------- lists
  const open = k => tasks.filter(t => !t.done && kindOf(t) === k).sort((a, b) => (a.created || 0) - (b.created || 0));
  function render() {
    for (const k of ["need", "want"]) {
      const items = open(k);
      $(k + "L").innerHTML = items.length
        ? items.map(t => `<li class="${k}" data-id="${esc(t.id)}"><button class="chk" type="button" data-a="done" aria-label="Done: ${esc(t.title)}"><span></span></button><span class="t">${esc(t.title)}</span><button class="x" type="button" data-a="del" aria-label="Delete ${esc(t.title)}">×</button></li>`).join("")
        : `<li class="empty" style="border:0;background:transparent">${loaded ? (k === "need" ? "Nothing you have to do. Nice." : "Nothing here yet. What sounds fun?") : "Loading…"}</li>`;
    }
    const today = dayKey(Date.now()), n = tasks.filter(t => t.done && t.doneAt && dayKey(t.doneAt) === today).length;
    $("count").textContent = n ? n + " done today" : "";
  }
  function finish(t) {
    const was = { ...t }; save({ ...t, done: true, doneAt: Date.now() });
    toast("Done: " + t.title, () => save(was));
  }
  function onList(e) {
    const b = e.target.closest("[data-a]"), li = e.target.closest("li[data-id]"); if (!b || !li) return;
    const t = tasks.find(x => x.id === li.dataset.id); if (!t) return;
    if (b.dataset.a === "done") finish(t);
    else { const was = { ...t }; del(t.id); toast("Deleted", () => save(was)); }
  }
  $("needL").addEventListener("click", onList); $("wantL").addEventListener("click", onList);

  // ---------- adding
  let kindClicked = "need";
  document.querySelectorAll("#add [data-k]").forEach(b => b.addEventListener("click", () => { kindClicked = b.dataset.k; }));
  $("add").addEventListener("submit", e => {
    e.preventDefault();
    const k = (e.submitter && e.submitter.dataset.k) || kindClicked || "need";
    const v = $("txt").value.trim(); if (!v) { $("txt").focus(); return; }
    save({ id: "t_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title: v, kind: k, done: false, doneAt: null, created: Date.now() });
    $("txt").value = ""; $("txt").focus(); kindClicked = "need";
  });

  // ---------- "What should I do?"
  // Needs come first, oldest first. Right after you finish a need, it offers a want as a reward.
  function choose() {
    const needs = open("need").filter(t => !skipped.includes(t.id)), wants = open("want").filter(t => !skipped.includes(t.id));
    const last = tasks.filter(t => t.done && t.doneAt).sort((a, b) => b.doneAt - a.doneAt)[0];
    const treat = last && kindOf(last) === "need" && Date.now() - last.doneAt < 6 * 36e5;
    if (treat && wants.length) return { t: wants[0], why: "You did a need. Have a want." };
    if (needs.length) return { t: needs[0], why: "Need" };
    if (wants.length) return { t: wants[0], why: "Want" };
    return null;
  }
  function show() {
    const c = choose(); current = c && c.t;
    if (!c) {
      $("oneTag").className = "tag"; $("oneTag").textContent = "";
      $("oneT").textContent = open("need").length + open("want").length ? "That's everything. Pick any or take a break." : "Nothing on the list. You're free.";
      $("oneDone").hidden = true; $("oneSkip").hidden = !skipped.length; $("oneSkip").textContent = "Start over";
    } else {
      $("oneTag").className = "tag " + kindOf(c.t); $("oneTag").textContent = c.why;
      $("oneT").textContent = c.t.title; $("oneDone").hidden = false; $("oneSkip").hidden = false; $("oneSkip").textContent = "Not this one";
    }
    $("one").hidden = false;
  }
  $("go").addEventListener("click", () => { skipped = []; show(); });
  $("oneDone").addEventListener("click", () => { if (current) finish(current); skipped = []; show(); });
  $("oneSkip").addEventListener("click", () => { if (current) skipped.push(current.id); else skipped = []; show(); });
  $("oneBack").addEventListener("click", () => { $("one").hidden = true; });
  document.addEventListener("keydown", e => { if (e.key === "Escape") $("one").hidden = true; });

  // ---------- start
  render();
  (async () => {
    const db = await use("db");
    store = db ? dbStore(db) : localStore();
    if (!db) $("note").textContent = "Saved on this device only.";
    store.watch(list => { tasks = list; loaded = true; render(); }, () => { $("note").textContent = "Lost the connection. Reload the page."; });
  })();
})();
</script>
