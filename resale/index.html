<title>Resale Stockroom</title>
<link rel="artifact-thumbnail" href="thumb.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600..900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a dark grid of product shots with orange price tags under a stat strip. Tabs sit at the thumb on phones, in the header on wide screens. */
:root{
  --bg:#0B0B0D; --surface:#151518; --raise:#1F1F24; --ink:#F5F5F4; --muted:#8E8E97; --line:#2A2A31;
  --act:#FF5B1F; --act-ink:#0B0B0D; --act-fg:#FF7A45; --act-soft:#33190F;
  --good:#34D27F; --good-soft:#12291D; --info:#79AEFF; --info-soft:#15223A; --warn:#FFB547; --warn-soft:#33260F; --bad:#FF7A7A;
  --tag:#FF5B1F; --tag-ink:#0B0B0D;
  --s1:#338ced; --s2:#e76624; --s3:#00a888; --s4:#d28e05; --s5:#e24d8b; --s6:#0aac23;
  --font-d:"Archivo","Inter",system-ui,sans-serif;
  --font-b:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-m:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F2F2F0; --surface:#FFFFFF; --raise:#EAEAE7; --ink:#0B0B0D; --muted:#5E5E66; --line:#DCDCD8;
    --act:#FF5B1F; --act-ink:#0B0B0D; --act-fg:#C2410C; --act-soft:#FFE6DA;
    --good:#127A45; --good-soft:#DCF2E5; --info:#1E5FD1; --info-soft:#E0EAFC; --warn:#8F4E00; --warn-soft:#FBEBD0; --bad:#B3261E;
    --tag:#FF5B1F; --tag-ink:#0B0B0D;
    --s1:#257de0; --s2:#f47230; --s3:#00b894; --s4:#f2a600; --s5:#ee7fac; --s6:#008a17;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F2F2F0; --surface:#FFFFFF; --raise:#EAEAE7; --ink:#0B0B0D; --muted:#5E5E66; --line:#DCDCD8;
  --act:#FF5B1F; --act-ink:#0B0B0D; --act-fg:#C2410C; --act-soft:#FFE6DA;
  --good:#127A45; --good-soft:#DCF2E5; --info:#1E5FD1; --info-soft:#E0EAFC; --warn:#8F4E00; --warn-soft:#FBEBD0; --bad:#B3261E;
  --tag:#FF5B1F; --tag-ink:#0B0B0D;
  --s1:#257de0; --s2:#f47230; --s3:#00b894; --s4:#f2a600; --s5:#ee7fac; --s6:#008a17;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.45;padding-bottom:88px;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.1}
h1,h2{font-family:var(--font-d);font-stretch:125%;font-weight:800;text-transform:uppercase;letter-spacing:-.01em}
h1{font-size:1.15rem;display:flex;align-items:center;gap:9px}
h1 .logo{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;background:var(--act);color:var(--act-ink)}
h2{font-size:1.2rem}
h3{font-family:var(--font-b);font-size:1rem;font-weight:700}
p{margin:0}
a{color:var(--act-fg)}
.ic{flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px 12px}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.mono{font-family:var(--font-m);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1 1 0;min-width:0}

/* nav */
#nav{position:fixed;inset:auto 0 0 0;z-index:20;display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
#nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--muted);font-family:var(--font-d);font-stretch:112%;font-weight:700;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;padding:7px 4px;border-radius:10px}
#nav a[aria-current="page"]{color:var(--ink)}
#nav a[aria-current="page"] .ic{color:var(--act)}
#nav a.add .bub{display:flex;align-items:center;justify-content:center;width:46px;height:30px;border-radius:9px;background:var(--act);color:var(--act-ink)}
#nav a.add[aria-current="page"] .ic{color:var(--act-ink)}
@media (min-width:720px){
  body{padding-bottom:32px}
  #nav{position:static;border:0;background:none;padding:0;gap:2px}
  #nav a{flex:none;flex-direction:row;gap:7px;font-size:.78rem;padding:9px 13px}
  #nav a[aria-current="page"]{background:var(--raise)}
  #nav a.add .bub{width:auto;height:auto;background:none;color:inherit}
  #nav a.add[aria-current="page"] .ic{color:var(--act)}
}

/* controls */
.btn{font:inherit;font-weight:600;font-size:.9rem;min-height:42px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-align:center}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--act);border-color:var(--act);color:var(--act-ink);font-weight:700}
.btn.sm{min-height:38px;padding:5px 12px;font-size:.84rem}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--act);outline-offset:2px}
.in{font:inherit;font-size:16px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.in::placeholder{color:var(--muted)}
textarea.in{resize:vertical;min-height:84px;line-height:1.4}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.fl{font-family:var(--font-m);font-size:.68rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fh{font-size:.8rem;color:var(--muted)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips.wrapc{flex-wrap:wrap;overflow:visible}
.chip{font:inherit;font-size:.84rem;font-weight:600;white-space:nowrap;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip b{font-family:var(--font-m);font-weight:700;margin-left:5px}
.fchip{display:inline-flex;align-items:center;gap:6px;font-size:.86rem;padding:5px 6px 5px 11px;border-radius:999px;background:var(--warn-soft);color:var(--ink)}
.fchip button{font:inherit;border:0;background:none;color:var(--muted);cursor:pointer;width:24px;height:24px;border-radius:50%;line-height:1}
.pick{font:inherit;color:inherit;display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.pick[aria-pressed="true"]{border-color:var(--act);background:var(--act-soft)}
.pick .mono{white-space:nowrap;font-size:.86rem}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:11px 13px;font-size:.88rem}
.note .ic{color:var(--warn);margin-top:1px}
.note.info{background:var(--info-soft)} .note.info .ic{color:var(--info)}
.note.good{background:var(--good-soft)} .note.good .ic{color:var(--good)}
.pill{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-m);font-size:.66rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--raise);color:var(--ink);white-space:nowrap}
.pill.listed{background:var(--info-soft);color:var(--info)}
.pill.sold,.pill.good{background:var(--good-soft);color:var(--good)}
.pill.ready,.pill.stale{background:var(--warn-soft);color:var(--warn)}
.dot{display:inline-block;flex:none;width:9px;height:9px;border-radius:50%;background:var(--muted)}
.sticker{flex:none;font-family:var(--font-m);font-weight:700;font-size:.92rem;background:var(--tag);color:var(--tag-ink);padding:4px 9px 4px 15px;clip-path:polygon(9px 0,100% 0,100% 100%,9px 100%,0 50%)}
.sticker.big{font-size:1.45rem;padding:7px 14px 7px 24px;clip-path:polygon(14px 0,100% 0,100% 100%,14px 100%,0 50%)}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0;display:flex;flex-direction:column;gap:3px}
.kpi b{font-family:var(--font-d);font-stretch:118%;font-size:clamp(1.2rem,5.6vw,1.9rem);font-weight:800;line-height:1.05;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.kpi .fl{display:flex;align-items:center;gap:5px}
.kpi small{font-size:.76rem;color:var(--muted)}
.pipe{display:flex;gap:2px;height:8px}
.pipe i{display:block;min-width:6px;border-radius:2px}
.pipe .none{flex:1;background:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.82rem;margin-top:8px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{font-family:var(--font-m);font-weight:700;color:var(--ink)}

/* stash cards */
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;cursor:pointer;color:inherit;font:inherit;min-width:0}
.card:hover{border-color:var(--muted)}
.pic{position:relative;aspect-ratio:1/1;background:var(--raise);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pic .sticker{position:absolute;right:0;bottom:10px}
.pic .pill{position:absolute;left:8px;top:8px}
.meta{padding:10px 11px 12px;display:flex;flex-direction:column;gap:6px}
.ititle{font-weight:600;font-size:.88rem;line-height:1.3;overflow-wrap:anywhere}
.sub{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:.74rem;color:var(--muted)}
.empty{grid-column:1/-1;padding:28px 0;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty p{max-width:40ch;color:var(--muted)}

/* add */
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;font-size:.78rem;font-weight:600}
.how div{display:flex;flex-direction:column;align-items:center;gap:6px}
.how span{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:12px;background:var(--act-soft);color:var(--act-fg)}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 16px;border:1.5px dashed var(--muted);border-radius:16px;background:var(--surface);cursor:pointer;text-align:center}
.drop strong{font-family:var(--font-d);font-stretch:125%;font-weight:800;text-transform:uppercase;font-size:1.05rem}
.drop .ic{color:var(--act)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.ph{position:relative;width:86px}
.ph img{width:86px;height:86px;object-fit:cover;border-radius:10px;background:var(--raise);display:block}
.ph button{margin-top:4px;width:100%}

/* sheet */
#sheet{position:fixed;inset:0;z-index:30;overflow-y:auto;background:var(--bg)}
.shead{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line)}
.shead .wrap{display:flex;align-items:center;gap:12px;padding-block:calc(env(safe-area-inset-top,0px) + 10px) 10px}
.sbody{padding-block:16px calc(40px + env(safe-area-inset-bottom,0px))}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.strip .ph{width:132px;flex:none}
.strip .ph img{width:132px;height:132px}
.steps{display:flex;gap:4px}
.step{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--font-m);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
.step i{display:block;width:100%;height:4px;border-radius:2px;background:var(--line)}
.step.done{color:var(--ink)} .step.done i{background:var(--act)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
details.sec{padding:0;display:block}
details.sec>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer}
details.sec>summary::-webkit-details-marker{display:none}
.sico{width:34px;height:34px;border-radius:10px;background:var(--raise);color:var(--act-fg);display:flex;align-items:center;justify-content:center;flex:none}
.ssum{margin-left:auto;font-size:.82rem;color:var(--muted);text-align:right;min-width:0;overflow-wrap:anywhere}
.chev{color:var(--muted);transition:transform .15s}
details[open]>summary .chev{transform:rotate(90deg)}
.inner{padding:2px 16px 16px;display:flex;flex-direction:column;gap:14px}
.site{display:flex;flex-direction:column;gap:9px;padding-top:14px;border-top:1px solid var(--line)}
.site:first-child{border-top:0;padding-top:0}
.bar{height:6px;border-radius:0 3px 3px 0;background:var(--line);position:relative}
.bar i{display:block;height:100%;border-radius:0 3px 3px 0;background:var(--good)}
.check{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--act)}

/* price gauge */
.gauge{position:relative;height:78px;margin:0 6px}
.g-track{position:absolute;left:0;right:0;top:35px;height:6px;border-radius:3px;background:var(--line)}
.g-band{position:absolute;top:35px;height:6px;border-radius:3px;background:var(--good)}
.g-comp{position:absolute;top:31px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--s1);border:2px solid var(--surface)}
.g-ask{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.g-ask::after{content:"";width:2px;height:22px;background:var(--act)}
.g-ask span{font-family:var(--font-m);font-weight:700;font-size:.8rem;background:var(--tag);color:var(--tag-ink);padding:2px 7px;border-radius:4px;white-space:nowrap}
.g-floor{position:absolute;top:35px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.g-floor::before{content:"";width:2px;height:16px;background:var(--muted)}
.g-floor span{font-family:var(--font-m);font-size:.74rem;color:var(--muted);white-space:nowrap;margin-top:3px}

/* fee chart */
.fee{display:grid;grid-template-columns:minmax(92px,auto) 1fr auto;gap:9px 10px;align-items:center;font-size:.86rem}
.fee .nm{display:flex;align-items:center;gap:7px;font-weight:600}
.fee .val{font-family:var(--font-m);font-variant-numeric:tabular-nums;text-align:right}
.fee .trk{height:12px}
.fee .trk i{display:block;height:100%;min-width:2px;border-radius:0 4px 4px 0;background:var(--act)}
input[type=range]{width:100%;accent-color:var(--act)}

/* heat */
.tgroup{display:flex;flex-direction:column;gap:10px}
.thead{display:flex;align-items:center;gap:8px}
.thead h3{font-family:var(--font-d);font-stretch:125%;font-weight:800;text-transform:uppercase;font-size:1rem}
.thead .sico.hot{background:var(--act-soft);color:var(--act-fg)}
.thead .sico.soon{background:var(--info-soft);color:var(--info)}
.thead .sico.glut{background:var(--raise);color:var(--muted)}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px;display:flex;flex-direction:column;gap:7px}
.tcard p{font-size:.88rem}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.9rem;max-width:min(92vw,460px);text-align:center}
#copybox{position:fixed;inset:auto 0 0 0;z-index:60;background:var(--surface);border-top:1px solid var(--line);padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
@media (prefers-reduced-motion:reduce){ .chev{transition:none} }
</style>

  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
</svg>

<header class="top"><div class="wrap">
  <h1><span class="logo"><svg class="ic" width="18" height="18"><use href="#i-tag"/></svg></span>Resale Stockroom</h1>
  <nav id="nav" aria-label="Sections">
    <a href="#shelf" data-v="shelf"><svg class="ic" width="22" height="22"><use href="#i-box"/></svg>Stash</a>
    <a href="#add" data-v="add" class="add"><span class="bub"><svg class="ic" width="20" height="20"><use href="#i-cam"/></svg></span>Add</a>
    <a href="#trends" data-v="trends"><svg class="ic" width="22" height="22"><use href="#i-trend"/></svg>Heat</a>
    <a href="#sites" data-v="sites"><svg class="ic" width="22" height="22"><use href="#i-store"/></svg>Sites</a>

          queueSave({ comps: cur.comps }); cLow.value = cHigh.value = ""; drawGauge();
        } }, "Log"))),
    fld("Search words", "search", { ph: "patagonia better sweater mens medium" }));

  /* post */
  const posts = h("div", { id: "it-posts" });
  function drawPosts() {
    posts.replaceChildren();
    const keys = enabledSites();
    if (!keys.length) { posts.append(h("p", { class: "muted" }, "No sites turned on. Pick them under Sites.")); return; }
    for (const k of keys) {
      const site = SITES[k], p = cur.posts[k] || {};
      const fee = cur.price ? site.fee(cur.price) : 0;
      const keep = cur.price ? Math.max(0, cur.price - fee) : 0;
      const url = h("input", { class: "in", id: "post-url-" + k, type: "url", placeholder: "Paste your listing link" }); url.value = p.url || "";
      url.addEventListener("input", () => { cur.posts[k] = { ...(cur.posts[k] || {}), url: url.value.trim() }; queueSave({ posts: { [k]: { url: url.value.trim() } } }); });
      const on = h("input", { type: "checkbox", id: "post-on-" + k, checked: !!p.on });
      on.addEventListener("change", () => {
        const at = on.checked ? (p.at || nowISO()) : (p.at || "");
        cur.posts[k] = { ...(cur.posts[k] || {}), on: on.checked, at };
        queueSave({ posts: { [k]: { on: on.checked, at } } }); drawPosts();
      });
      const view = httpsOnly(p.url);
      posts.append(h("div", { class: "site" },
        h("div", { class: "row" }, dot(k), h("h3", null, site.name), (cur.bestSites || []).includes(k) && h("span", { class: "pill good" }, ic("check", 12), "good fit"),
          h("span", { class: "grow" }), cur.price && h("span", { class: "small" }, "keep ", h("b", { class: "mono" }, money(keep)), site.feeHint ? " " + site.feeHint : "")),
        cur.price && h("div", { class: "bar", title: "Fee " + money(fee) }, h("i", { style: "width:" + (keep / cur.price * 100) + "%" })),
        h("div", { class: "row" },
          h("a", { class: "btn sm pri", href: site.open, target: "_blank", rel: "noopener", onclick: () => { if (cur.title) copy(cur.title, "Title copied. Paste it on " + site.short + "."); } }, ic("out", 16), "Open"),
          h("button", { class: "btn sm", type: "button", onclick: () => copy(listingText(cur, k), "Listing text copied") }, ic("copy", 16), "Copy text"),
          h("label", { class: "check", for: "post-on-" + k, style: "margin-left:auto" }, on, p.on ? "Posted " + day(p.at) : "Posted")),
        p.on && h("div", { class: "row" }, h("div", { class: "grow" }, url), view && h("a", { class: "btn sm", href: view, target: "_blank", rel: "noopener" }, "View", ic("out", 14)))));
    }
  }
  drawPosts();
  const post = section("send", "Post it", first === "post",
    h("p", { class: "fh" }, "Open copies the title. Then come back for the text."), posts);

  /* sold */
  const soldBox = h("div", { class: "stack", id: "it-sold" });
  const drawSold = () => {
    soldBox.replaceChildren();
    if (cur.sold) {
      const s = cur.sold, profit = (s.price || 0) - (s.fee || 0) - (s.ship || 0) - (cur.cost || 0);
      const kpi = (label, big) => h("div", { class: "kpi" }, h("span", { class: "fl" }, label), h("b", null, big));
      soldBox.append(h("div", { class: "kpis" }, kpi("Sold for", money(s.price)), kpi("Fees + ship", money((s.fee || 0) + (s.ship || 0))), kpi("Profit", money(profit))),
        h("p", { class: "small muted" }, h("span", { style: "display:inline-flex;gap:6px;align-items:center" }, dot(s.site), siteName(s.site) + ", " + day(s.at))));
      const still = postedOn(cur).filter(k => k !== s.site);
      if (still.length) soldBox.append(note("", "warn", h("strong", null, "Take it down so it doesn't sell twice"),
        h("div", { class: "row", style: "margin-top:8px" }, still.map(k => h("button", { class: "btn sm", type: "button", onclick: () => {
          cur.posts[k] = { ...cur.posts[k], on: false }; queueSave({ posts: { [k]: { on: false } } }); drawSold(); drawPosts();
        } }, dot(k), "Removed from " + SITES[k].short)))));
      soldBox.append(h("div", { class: "row" }, confirmBtn("Undo sold", "Back on the shelf?", () => { set("sold", null); drawSold(); })));
      return;
    }
    const where = h("select", { class: "in", id: "sold-site" }, enabledSites().map(k => h("option", { value: k }, SITES[k].name)), h("option", { value: "other" }, "In person / other"));
    const firstOn = postedOn(cur).find(k => S.cfg.sites[k]); if (firstOn) where.value = firstOn;
    const sp = h("input", { class: "in", id: "sold-price", inputmode: "decimal", placeholder: "$0" }); sp.value = cur.price ?? "";
    const ship = h("input", { class: "in", id: "sold-ship", inputmode: "decimal", placeholder: "$0" });
    soldBox.append(h("div", { class: "grid" },
      h("label", { class: "f" }, h("span", { class: "fl" }, "Where"), where),
      h("label", { class: "f" }, h("span", { class: "fl" }, "Sold for"), sp),
      h("label", { class: "f" }, h("span", { class: "fl" }, "Shipping you paid"), ship)),
      h("div", { class: "row" }, h("button", { class: "btn pri", type: "button", onclick: () => {
        const price = num(sp.value); if (price == null) { toast("Put in what it sold for."); return; }
        const site = where.value, fee = SITES[site] ? Math.round(SITES[site].fee(price) * 100) / 100 : 0;
        set("sold", { price, site, ship: num(ship.value) || 0, fee, at: nowISO() }); drawSold();
      } }, ic("check", 16), "Mark sold")));
  };
  drawSold();
  const sold = section("check", "Sold", first === "sold", soldBox);

  /* more */
  const moreSec = section("more", "More", false,
    fld("Where it's stored", "spot", { ph: "Closet, top shelf" }),
    fld("Notes", "notes", { area: true, rows: 3 }),
    h("div", { class: "row" }, confirmBtn("Delete item", "Delete for good?", deleteItem, "btn sm danger")));

  body.append(listing.el, price.el, post.el, sold.el, moreSec.el);

  meta = () => {
    if (!cur) return;
    const d = done();
    for (const k of Object.keys(stepEls)) stepEls[k].classList.toggle("done", !!d[k]);
    heroTitle.textContent = cur.title || "Untitled item";
    listing.sum.textContent = [cur.condition, cur.flaws.length ? cur.flaws.length + (cur.flaws.length === 1 ? " flaw" : " flaws") : ""].filter(Boolean).join(" · ") || "Not written";
    price.sum.textContent = cur.price ? money(cur.price) : "No price";
    post.sum.textContent = postedOn(cur).map(k => SITES[k].short).join(", ") || "Not posted";
    sold.sum.textContent = cur.sold ? money(cur.sold.price) : "";
    moreSec.sum.textContent = cur.spot || "";
  };
  meta();
}
async function deleteItem() {
  const id = curId, photos = [...cur.photos];
  clearTimeout(saveTimer); pending = {};
  try { await S.db.doc("items/" + id).delete(); } catch { toast("Couldn't delete. Check your connection."); return; }
  if (S.assets) for (const p of photos) { try { await S.assets.delete(p); } catch { /* leftover file */ } }
  S.items = S.items.filter(i => i.id !== id);
  curId = null; await closeItem(); toast("Deleted");
}
async function photoBlobs() {
  const out = [];
  for (const pid of cur.photos) { const r = await fetch("/_blob/" + encodeURIComponent(pid)); if (!r.ok) throw new Error("photo"); out.push(await r.blob()); }
  return out;
}
async function savePhotos() {
  let blobs;
  try { blobs = await photoBlobs(); } catch { toast("Couldn't load the photos. Press and hold one to save it."); return; }
  const base = (cur.title || "item").toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 40) || "item";
  for (let i = 0; i < blobs.length; i++) {
    try { await S.downloads.save({ filename: base + "-" + (i + 1) + ".jpg", data: blobs[i] }); }
    catch (e) { if (e && e.code === "declined") return; toast("Couldn't save here. Press and hold a photo instead."); return; }
  }
  toast("Photos saved");
}
let refining = false;
async function refine() {
  if (refining || !cur) return;
  refining = true;
  const btn = $("#it-refine"); if (btn) { btn.disabled = true; btn.lastChild.textContent = "Claude is working…"; }
  saveState("Claude is working…");
  let blobs = [];
  if (cur.photos.length && S.maxImages) { try { blobs = await photoBlobs(); } catch { blobs = []; } }
  const id = curId;
  const said = [...cur.facts.map(f => f.q ? f.q + " " + f.a : String(f)), ...cur.ask.filter(q => q.a).map(q => q.q + " " + q.a)];
  if (cur.pick) said.push("The exact model is: " + cur.pick);
  const known = [["Brand", cur.brand], ["Model", cur.model], ["Size", cur.size], ["Color", cur.color], ["Condition", cur.condition], ["Flaws", cur.flaws.join("; ")]].filter(x => x[1]).map(x => x[0] + ": " + x[1]);
  const linkNote = cur.link ? "The seller pasted this product link or model number. You can't open links, so read the brand and exact model from its text if they are there: " + cur.link.slice(0, 500) : "";
  const notes = [cur.notes, linkNote, known.length ? "Already on the listing:\n" + known.join("\n") : "",
    said.length ? "Answers the seller already gave. Use them and don't ask these again:\n- " + said.join("\n- ") : ""].filter(Boolean).join("\n\n");
  try {
    const ai = fromAI(await identify(blobs, notes, undefined, cur.title || ""));
    if (curId !== id) return;
    for (const k of Object.keys(ai)) {
      const v = ai[k], empty = v === "" || v == null || (Array.isArray(v) && !v.length);
      if (empty && !["ask", "picks", "pick", "unsure"].includes(k)) delete ai[k];
    }
    ai.facts = [...cur.facts, ...cur.ask.filter(q => q.a && q.a !== "Not sure").map(q => ({ q: q.q, a: q.a }))].slice(-12);
    Object.assign(cur, ai); queueSave(ai); renderSheet(); toast(cur.ask.length ? "A few more questions" : "Price ready");
  } catch (e) { saveState("Saved"); toast(sampleMsg(e)); if (btn) { btn.disabled = false; btn.lastChild.textContent = "Get my price"; } }
  finally { refining = false; }
}

/* ---------- trends ---------- */
function renderTrends() {
  const v = $("#v-trends"); v.replaceChildren();
  const t = S.trends;
  v.append(h("div", { class: "row" }, h("h2", { class: "grow" }, "What's hot"), t && h("span", { class: "pill" }, ic("clock", 12), "Updated " + day(t.updatedAt))));
  if (!t) { v.append(h("p", { class: "muted" }, S.trendsLoaded ? "Nothing yet. Claude fills this in every Monday." : "Loading…")); return; }
  if (t.headline) v.append(note("good", "spark", t.headline));
  const mine = keys => Array.isArray(keys) && keys.length ? S.items.filter(i => !i.sold && !i.example && keys.some(k => [i.title, i.brand, i.category].join(" ").toLowerCase().includes(String(k).toLowerCase()))) : [];
  for (const [key, title, icon] of [["hot", "Heat", "up"], ["soon", "On deck", "clock"], ["glut", "Bricks", "down"]]) {
    const rows = Array.isArray(t[key]) ? t[key] : [];
    if (!rows.length) continue;
    const cards = h("div", { class: "tcards" });
    for (const r of rows) {
      const have = mine(r.match);
      const where = strs(String(r.where || "").split(","));
      cards.append(h("div", { class: "tcard" }, h("strong", null, str(r.name)), h("p", { class: "muted" }, str(r.why)),
        (where.length || have.length) ? h("div", { class: "chips wrapc" }, where.map(w => h("span", { class: "pill" }, w)),
          have.length ? h("span", { class: "pill good" }, ic("box", 12), have.length + " in your stash") : null) : null));
    }
    v.append(h("div", { class: "tgroup" }, h("div", { class: "thead" }, h("span", { class: "sico " + key }, ic(icon, 18)), h("h3", null, title)), cards));
  }
  const src = (Array.isArray(t.sources) ? t.sources : []).filter(s => httpsOnly(s.u));
  if (src.length) v.append(h("details", null, h("summary", { class: "small muted", style: "cursor:pointer" }, "Sources (" + src.length + ")"),
    h("div", { class: "row", style: "margin-top:8px" }, src.map(s => h("a", { class: "btn sm", href: httpsOnly(s.u), target: "_blank", rel: "noopener" }, str(s.t) || "Source", ic("out", 14))))));
}

/* ---------- sites ---------- */
function renderSites() {
  const v = $("#v-sites"); v.replaceChildren(h("h2", null, "Where you sell"));
  const rows = [
    { k: "poshmark", label: "Poshmark", fee: SITES.poshmark.fee }, { k: "ebay", label: "eBay", fee: SITES.ebay.fee },
    { k: "mercari", label: "Mercari", fee: SITES.mercari.fee }, { k: "fb", label: "Facebook, shipped", fee: SITES.fb.feeShip },
    { k: "depop", label: "Depop", fee: SITES.depop.fee }, { k: "fb", label: "Facebook, local", fee: SITES.fb.fee },
    { k: "craigslist", label: "Craigslist", fee: SITES.craigslist.fee }];
  const title = h("h3", null), chart = h("div", { class: "fee", id: "fee-chart" });
  const slider = h("input", { type: "range", id: "fee-price", min: 5, max: 300, step: 5, "aria-label": "Sale price" }); slider.value = S.feePrice;
  const draw = () => {
    const p = S.feePrice; title.textContent = "What each site takes from a " + money(p) + " sale";
    const fees = rows.map(r => r.fee(p)), max = Math.max(...fees, 0.01);
    chart.replaceChildren();
    rows.forEach((r, i) => chart.append(

      h("div", { class: "trk", title: r.label + ": takes " + money(fees[i]) + ", you keep " + money(p - fees[i]) }, fees[i] > 0 && h("i", { style: "width:" + (fees[i] / max * 100) + "%" })),
      h("span", { class: "val" }, money(Math.round(fees[i] * 100) / 100) || "$0")));
  };
  slider.addEventListener("input", () => { S.feePrice = +slider.value; draw(); });
  draw();
  v.append(h("div", { class: "sec" }, title, h("div", { class: "row" }, h("span", { class: "small muted mono" }, "$5"), h("div", { class: "grow" }, slider), h("span", { class: "small muted mono" }, "$300")), chart,
    h("p", { class: "fh" }, "Fees checked " + FEES_CHECKED + ". Shipping and sales tax not included.")));

  const sec = h("div", { class: "sec" }, h("h3", null, "Sites you use"));
  const box = h("div", null);
  for (const k of Object.keys(SITES)) {
    const cb = h("input", { type: "checkbox", id: "site-" + k, checked: !!S.cfg.sites[k] });
    cb.addEventListener("change", async () => {
      S.cfg.sites = { ...S.cfg.sites, [k]: cb.checked };
      if (!S.db) return;

    });
    box.append(h("div", { class: "site" }, h("label", { class: "check", for: "site-" + k }, cb, dot(k), SITES[k].name, h("span", { class: "grow" }), h("span", { class: "small muted", style: "font-weight:400" }, SITES[k].feeText))));
  }
  sec.append(box);
  v.append(sec, h("details", { class: "sec" }, h("summary", null, h("span", { class: "sico" }, ic("warn", 18)), h("h3", null, "Why can't it post for me?"), h("span", { class: "chev", style: "margin-left:auto" }, ic("chev", 16))),
    h("div", { class: "inner" }, h("p", { class: "small" }, "Facebook, Mercari and Poshmark don't let outside apps post. Depop only lets approved business partners. eBay does, but it needs a developer account. So it's open, paste, add photos."))));
}

route(); renderShelf();
(async () => {
  const c = window.claude;
  if (!c || !c.use) { S.loaded = true; S.dead = "Open this page inside Claude to load and save your inventory."; renderShelf(); return; }
  const use = n => c.use(n).catch(() => null);
  const [db, assets, sample, downloads] = await Promise.all([use("db"), use("assets"), use("sample"), use("downloads")]);
  Object.assign(S, { db, assets, sample, downloads });
  if (sample) { try { const lim = await sample.limits(); S.maxImages = lim && lim.images ? lim.images.maxCount : 0; } catch { S.maxImages = 0; } }
  $("#add-ai").hidden = !sample;
  if (!db) { S.loaded = true; S.dead = "Your inventory can't be reached from this view. Open it signed in to Claude."; renderShelf(); return; }
  const slowTimer = setTimeout(() => { S.slow = true; renderShelf(); }, 10000);
  db.collection("items").onSnapshot(snap => {
    S.items = snap.docs.map(d => ({ ...clone(d.data()), id: d.id }));

  }, () => { clearTimeout(slowTimer); S.loaded = true; S.dead = "Lost the connection to your inventory. Reopen the page to try again."; renderShelf(); });

    if (!$("#v-sites").hidden) renderSites();
  }, () => {});
  db.doc("trends/current").onSnapshot(snap => {
    S.trends = snap.exists ? clone(snap.data()) : null; S.trendsLoaded = true;
    if (!$("#v-trends").hidden) renderTrends();
  }, () => { S.trendsLoaded = true; });
})();
